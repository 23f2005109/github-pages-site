name: cache-workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cache-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/.cache/demo
          key: cache-679086a

      - name: prime-cache-679086a
        run: echo "Cache hit = ${{ steps.cache-step.outputs.cache-hit }}"
